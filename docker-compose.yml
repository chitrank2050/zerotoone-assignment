version: '3.8'

services:
  # --- Backend Intelligence Layer ---
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/prod.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - audience-data:/app/data
    networks:
      - audience-net
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.1'
    restart: unless-stopped

  # --- Frontend UX Layer ---
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - audience-net
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.1'
    restart: unless-stopped

networks:
  audience-net:
    driver: bridge

volumes:
  audience-data:
    driver: local
