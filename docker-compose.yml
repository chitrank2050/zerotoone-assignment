services:
  backend:
    container_name: audience-builder-backend
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - apps/backend/.env
    volumes:
      - ./apps/backend/prisma:/app/apps/backend/prisma
    restart: always

  frontend:
    container_name: audience-builder-frontend
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
