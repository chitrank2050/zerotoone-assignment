site_name: AI Audience Builder
site_url: https://chitrank2050.github.io/audience-builder/
site_description: High-performance monorepo for AI-driven advertising segmentation.
site_author: Chitrank Agnihotri

repo_name: audience-builder
repo_url: https://github.com/chitrank2050/zerotoone-assignment

theme:
  name: material
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant # No page refreshes
    - navigation.tracking # URL updates as you scroll
    - navigation.tabs # Top-level header navigation
    - navigation.tabs.sticky # Header stays at the top
    - navigation.sections # Organized sidebar sections
    - navigation.expand # Auto-expand sections
    - navigation.path # Breadcrumbs for better orientation
    - navigation.top # "Back to top" button
    - search.highlight # Highlight search results
    - search.share # Shareable search links
    - content.code.copy # Copy button on code blocks
    - toc.follow # TOC follows scrolling

  # Icons & Logo
  icon:
    repo: fontawesome/brands/github
    logo: material/gauge

  # Modern Typography (Inter is the clean standard)
  font:
    text: Inter
    code: Roboto Mono

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.magiclink
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - 🚀 Getting Started: getting-started.md
  - 🏛️ Architecture: architecture.md
  - 🛠️ Development: development.md
  - 🚀 Deployment: deployment.md
  - 🔌 API Reference:
      - Overview: api/overview.md
      - Authentication: api/auth.md
      - Chat & AI: api/chat.md
      - Taxonomy: api/taxonomy.md
      - System Health: api/health.md
  - 📜 Changelog: changelog.md

extra:
  # Social Sharing Metadata (Open Graph)
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/chitrank2050
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/chitrank-agnihotri/
    - icon: fontawesome/solid/globe
      link: https://chitrankagnihotri.com/

